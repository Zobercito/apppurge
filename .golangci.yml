version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - unused
    - ineffassign
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gosec:
      excludes:
        - G204
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
